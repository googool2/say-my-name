<svg xmlns="http://www.w3.org/2000/svg" width="760" height="96" viewBox="0 0 760 96" role="img" aria-label="Say My Name in numbers" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>Say My Name in numbers</title>
<rect x="0.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="16.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">0 / 12</text>
<text x="16.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">false wins</text>
<text x="16.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">identical-copy controls</text>
<rect x="193.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="209.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">4 / 24</text>
<text x="209.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">rewrites won</text>
<text x="209.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">12 live pages, EN + FA</text>
<rect x="386.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="402.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">0 / 24</text>
<text x="402.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">made a page worse</text>
<text x="402.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">paired tests, p &lt; 0.025</text>
<rect x="579.5" y="0.5" width="180.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,0.12)"/>
<text x="595.0" y="42.0" font-size="28" fill="#f0efec" text-anchor="start" font-weight="600">$0.06</text>
<text x="595.0" y="66.0" font-size="12" fill="#f0efec" text-anchor="start" font-weight="400">per test call</text>
<text x="595.0" y="82.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Claude Sonnet, measured</text>
</svg>
